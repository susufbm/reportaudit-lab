# Pipeline de la cadena de suministro segura de ReportAudit.
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: Cadena de suministro segura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto, los jobs solo pueden LEER el repositorio.
permissions:
  contents: read

jobs:
  sonarqube-cloud:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Preparar CodeQL para Python
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: python
          queries: security-extended

      - name: Ejecutar el análisis y publicar los resultados
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:python"

  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Preparar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # pypa/gh-action-pip-audit@v1.1.0 no admite la opción disable-pip: la
      # ignoraba y pip-audit intentaba resolver el lockfile, así que un
      # conflicto de versiones lo ponía en rojo sin llegar a auditar nada.
      # Se ejecuta pip-audit directamente, con versión fijada.
      - name: Instalar pip-audit
        run: 'python -m pip install --no-cache-dir --only-binary=:all: pip-audit==2.10.1'

      - name: Auditar las dependencias con pip-audit
        run: >-
          pip-audit -r requirements.txt --no-deps --disable-pip
          --progress-spinner off --desc on

  secretos-gitleaks:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Buscar secretos en los commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
